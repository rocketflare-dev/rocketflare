# STAGING Worker config — standalone copy of wrangler.toml (the production file) — keep the
# two files in sync: same bindings/classes/limits, differing ONLY in name, routes, [vars]
# URLs/APP_ENV, and resource ids. tests/config/wrangler-parity.test.ts enforces this and
# fails while any <PLACEHOLDER> remains. See docs/DEPLOY.md and scripts/cf-provision.sh.
#
# ADAPTING: rename `rocketflare` → your app (worker name, queue/workflow names, buckets).

name = "rocketflare-staging"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Fallback host rocketflare-staging.<subdomain>.workers.dev while the custom domain is set up.
workers_dev = true

# Custom domain (wrangler creates the DNS record on deploy). Uncomment once the zone exists.
# routes = [{ pattern = "staging.rocketflare.dev", custom_domain = true }]

[vars]
APP_ENV = "staging"                    # development | staging | production
APP_URL = "https://staging.rocketflare.dev"  # public origin; derives OAuth redirect URIs, magic links, CSRF
APP_NAME = "Rocketflare"
# Overridden at deploy time by CI: `wrangler deploy --var RELEASE_VERSION:<tag>`
RELEASE_VERSION = "dev"
LOG_LEVEL = "info"
EMAIL_FROM = "Rocketflare <noreply@rocketflare.dev>"
TENANCY_MODE = "multi"                 # multi | single   (docs/CONCEPTS.md → Tenancy)
SIGNUP_MODE = "invite_only"            # open | invite_only | approval
TENANT_SCOPE_MODE = "off"              # off | enforce    (docs/RLS.md — enforce needs HYPERDRIVE_APP)
AGENT_MAX_OUTPUT_TOKENS = "16384"      # AI (D17): per-call max_tokens when a tenant config sets none
AGENT_MAX_TURNS = "30"                 # AI (D17): turn cap for every tool loop
# Secrets are NOT here: `wrangler secret put <NAME>` for every non-var in .dev.vars.example

[placement]
mode = "smart"                          # run near the database (Neon region), not the user

# [limits]
# cpu_ms = 30000   # Default. NOTE: Workflows bound CPU *per step* by this value too; if you
#                  # raise it, raise it identically in wrangler.staging.toml (parity test).

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

# React SPA served from Workers Static Assets, deployed atomically with the Worker. API
# routes are matched by Hono first; the catch-all serves assets with SPA fallback.
[assets]
directory = "./dist/ui"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Postgres via Hyperdrive → Neon. Create: wrangler hyperdrive create rocketflare-staging \
#   --connection-string="<neon direct url>"   (then paste the id below)
# `wrangler dev` ignores `id` and uses localConnectionString (docker-compose.dev.yml).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<HYPERDRIVE_STAGING_ID>"
localConnectionString = "postgresql://rocketflare:rocketflare_pass@localhost:5432/rocketflare_dev"

# KV for auth rate limiting + per-tenant operation locks. Create: wrangler kv namespace create RATE_LIMIT_STAGING
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "<KV_RATE_LIMIT_STAGING_ID>"

# Cron triggers — dispatched by src/api/scheduled.ts keyed on event.cron.
[triggers]
crons = [
  "0 4 * * *",     # Daily 04:00 UTC — prune expired sessions, magic links, rate-limit state
  "15 * * * *",    # Hourly at :15 — rebuild fact tables per tenant (D19, services/fact-tables)
]

# Background jobs (D7): one queue, one consumer; `src/api/queue.ts` dispatches on `batch.queue`.
# Create: wrangler queues create rocketflare-jobs-staging
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "rocketflare-jobs-staging"

[[queues.consumers]]
queue = "rocketflare-jobs-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
# dead_letter_queue = "rocketflare-jobs-staging-dlq"

# Realtime (D8): stateless WebSocket hub Durable Object, one instance per tenant
# (`idFromName(tenantId)`), hibernation API. Implementing a DO in-script disables preview URLs.
[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[migrations]]
tag = "v1"
new_classes = ["NotificationsHub"]

# File storage (D23): R2 behind `services/storage.ts`. Create: wrangler r2 bucket create rocketflare-files-staging
[[r2_buckets]]
binding = "FILES"
bucket_name = "rocketflare-files-staging"

# Workers AI (D17): zero-key embeddings (`@cf/baai/bge-m3`, 1024-dim) via services/ai/client.ts.
# Optional in code: the resolver falls through to an OpenAI-shaped key when the binding is absent.
[ai]
binding = "AI"
# Workers AI has no local emulation: wrangler dev calls Cloudflare even in dev (needs `wrangler login`).
# Comment this block out to run fully offline — embeddings then fall back to EMBEDDINGS_API_KEY or "none".
remote = true

# Agent runs (D7): the ONE Workflow class — the agent runtime IS the example workflow. `name` is
# ACCOUNT-scoped (staging uses `-staging`); binding and class_name are identical in both tomls.
# Nothing to create: `wrangler deploy` registers the Workflow. Instance id = agent_runs.id.
[[workflows]]
name = "rocketflare-agent-run-staging"
binding = "AGENT_RUN_WORKFLOW"
class_name = "AgentRunWorkflow"

# ---- Added in later phases (keep this list in sync with wrangler.toml) ----------
# Phase 4 (D19): optional [[analytics_engine_datasets]] for product telemetry — not wired yet
