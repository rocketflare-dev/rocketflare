# Local development Postgres. pgvector image because the AI layer stores embeddings in
# Postgres (`vector` extension); otherwise a plain postgres:17. Port 5432; tests use 5433.
services:
  postgres-dev:
    image: pgvector/pgvector:pg17
    container_name: rocketflare-dev-postgres
    environment:
      POSTGRES_DB: rocketflare_dev
      POSTGRES_USER: rocketflare
      POSTGRES_PASSWORD: rocketflare_pass
    ports:
      - "5432:5432"
    volumes:
      - rocketflare-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocketflare -d rocketflare_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rocketflare-dev-data:
