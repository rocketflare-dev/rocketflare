# Local development Postgres. pgvector image because the AI layer stores embeddings in
# Postgres (`vector` extension); otherwise a plain postgres:17. Tests use 5433.
#
# The port and the container name are variables so that a SECOND checkout on this machine gets
# its own database instead of colliding on 5432: `pnpm dev:db:up` runs scripts/dev-db.mjs, which
# derives both from `DATABASE_URL` in .dev.vars and sets COMPOSE_PROJECT_NAME per checkout. The
# defaults below are what a bare `docker compose -f docker-compose.dev.yml up` gets — correct for
# a single checkout, and the literals `pnpm adapt` rewrites.
#
# `neon-proxy-dev` (profile `neon`, off by default) is the Neon HTTP/WebSocket proxy for running
# the deployed `neon` driver locally (D35): `pnpm dev:db:up --neon` starts it on a per-checkout port
# and writes NEON_LOCAL_PROXY; `--postgres` stops it. Our build on a mirror of a community image packaging Neon's open-source
# proxy, PINNED BY DIGEST (rules/database.md). It creates a `neon_control_plane` schema.
services:
  postgres-dev:
    image: pgvector/pgvector:pg17
    container_name: ${DEV_DB_CONTAINER:-rocketflare-dev-postgres}
    environment:
      POSTGRES_DB: rocketflare_dev
      POSTGRES_USER: rocketflare
      POSTGRES_PASSWORD: rocketflare_pass
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      - rocketflare-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocketflare -d rocketflare_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  neon-proxy-dev:
    profiles: ["neon"]
    image: ghcr.io/rocketflare-dev/local-neon-proxy@sha256:fbc2c4dd398d7f8b530bc11e0dbc7e24176d4db7bca2f4d88f21b5b4e50580f8
    container_name: ${DEV_NEON_PROXY_CONTAINER:-rocketflare-dev-neon-proxy}
    # Our image (docker/Dockerfile.neon-proxy): the mirrored proxy with docker/neon-proxy-start.sh
    # baked in as the entrypoint, ~10x faster locally than the image's own script. Baked, not
    # mounted: Colima and remote Docker contexts cannot see a checkout outside $HOME.
    environment:
      PG_CONNECTION_STRING: postgres://rocketflare:rocketflare_pass@postgres-dev:5432/rocketflare_dev
      PROXY_ROLE_PASSWORD: rocketflare_pass
    ports:
      - "${DEV_NEON_PROXY_PORT:-4444}:4444"
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:4444/sql -H 'Neon-Connection-String: postgresql://rocketflare:rocketflare_pass@localhost/rocketflare_dev' -d '{\"query\":\"select 1\",\"params\":[]}' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  rocketflare-dev-data:
