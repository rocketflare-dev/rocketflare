# Test Postgres on 5433. `max_connections=300` because vitest runs several forks, each with
# its own pools; at the 100 default the suite flaked ~1 in 8 with "53300 too many clients".
# Keep in step with the Postgres service in .github/workflows/ci.yml.
#
# `neon-proxy-test` (profile `neon`, off by default) is the Neon HTTP/WebSocket proxy the `neon`
# driver talks to (D35): `pnpm test:neon` and CI's `test-neon` job start it; the gate never does.
# A community image packaging Neon's open-source proxy, PINNED BY DIGEST (rules/database.md). It
# creates a `neon_control_plane` schema in the database it fronts; nothing in the kit reads it.
services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: rocketflare-test-postgres
    command: -c max_connections=300
    environment:
      POSTGRES_DB: rocketflare_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rocketflare_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  neon-proxy-test:
    profiles: ["neon"]
    image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    container_name: rocketflare-test-neon-proxy
    # Our start script, not the image's: it makes the proxy ~10x faster locally (see the script).
    entrypoint: ["bash", "/rocketflare/neon-proxy-start.sh"]
    volumes:
      - ./docker/neon-proxy-start.sh:/rocketflare/neon-proxy-start.sh:ro
    environment:
      PG_CONNECTION_STRING: postgres://test:test@postgres-test:5432/rocketflare_test
      PROXY_ROLE_PASSWORD: test
    ports:
      - "4433:4444"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:4444/sql -H 'Neon-Connection-String: postgresql://test:test@localhost/rocketflare_test' -d '{\"query\":\"select 1\",\"params\":[]}' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15
