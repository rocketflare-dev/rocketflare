# Test Postgres on 5433. `max_connections=300` because vitest runs several forks, each with
# its own pools; at the 100 default the suite flaked ~1 in 8 with "53300 too many clients".
# Keep in step with the Postgres service in .github/workflows/ci.yml.
services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: gmgo-test-postgres
    command: -c max_connections=300
    environment:
      POSTGRES_DB: gmgo_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gmgo_test"]
      interval: 5s
      timeout: 5s
      retries: 5
