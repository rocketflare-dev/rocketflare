name: Gate

# The gate itself — lint, typecheck, test, build — in ONE job, called three times (D31, decision 5):
#
#   ci.yml `check`    the ordinary gate, on the checkout as it is;
#   ci.yml `plugins`  the same gate with every `defaultPlugins` entry installed first (kit only);
#   ci.yml `renamed`  the same gate on the checkout renamed by `scripts/rename.mjs` first (kit only).
#
# In a copy of the kit only `check` runs: its plugins are installed and committed, so the one gate
# covers them. deploy.yml reaches this file through ci.yml, and only for a commit that has no
# successful CI run yet, so a commit pushed to main and then deployed is gated once.
#
# A second copy of these steps was the alternative, and a gate that drifts between its two copies
# proves nothing about the copy nobody ran. So the Postgres service, the install and the gate live
# here and the difference is one boolean input.
#
# Workspace note: the repo is a pnpm workspace (apps/web, apps/cli, packages/shared). Every step
# runs at the repository ROOT; the root scripts fan out with `pnpm -r` / `--filter`, and pnpm runs
# each package's script with that package as its cwd. No `working-directory` is needed anywhere:
# the web tests load `apps/web/.env.test` through their own `dotenv -e .env.test` script, wrangler
# resolves `wrangler.toml` / `[assets] directory` inside apps/web, and the CLI builds in apps/cli.

on:
  workflow_call:
    inputs:
      plugins:
        description: >-
          Install every `defaultPlugins` entry from .rocketflare.json before running the gate, and
          generate + apply their migrations. The secrets scan and the porting-note check are skipped
          in that pass — they are properties of the checkout, and the first pass already ran them.
        type: boolean
        default: false
      rename:
        description: >-
          A slug to rename the checkout to with `scripts/rename.mjs` before the gate, as every copy
          of the kit is. Empty = no rename. The secrets scan and the porting-note check are skipped
          in that pass, like the plugins pass: they are properties of the kit's checkout.
        type: string
        default: ''

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17 # migration 0000 runs CREATE EXTENSION vector (D17)
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rocketflare_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d rocketflare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks scan below
      # pnpm version comes from `packageManager` in the root package.json (pnpm 10). Must precede
      # setup-node so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # One install for the whole workspace; packages/shared is linked as TypeScript source.
      - run: pnpm install --frozen-lockfile

      # Match apps/web/docker-compose.test.yml's `-c max_connections=300`. A `services:` container
      # takes no command arg, so the setting is applied and the container restarted instead. At the
      # 100 default the suite flaked ~1 in 8 with `53300 sorry, too many clients already`:
      # vitest runs up to 6 forks and each holds its own postgres.js pool.
      - name: Raise the test database connection limit
        run: |
          cid=$(docker ps --filter "ancestor=pgvector/pgvector:pg17" --format '{{.ID}}' | head -1)
          docker exec "$cid" psql -U test -d rocketflare_test -c "ALTER SYSTEM SET max_connections = 300;"
          docker restart "$cid"
          for _ in $(seq 1 30); do
            docker exec "$cid" pg_isready -U test -d rocketflare_test >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$cid" psql -U test -d rocketflare_test -c "show max_connections;"

      # Secrets scan first: cheapest step, and the one whose failure must not be buried under a
      # test log. Runs the binary directly (the marketplace action needs a licence for org repos).
      # Scans the full history so a secret committed-then-removed is still caught.
      - name: gitleaks
        if: ${{ !inputs.plugins && inputs.rename == '' }}
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --verbose .

      # A behaviour change with no porting note is invisible to every copy of the kit that is
      # already out there: `pnpm kit:upgrade` replays a translated diff guided by those notes, so
      # the gap is permanent. The script exits 0 immediately in an adopted copy (`.rocketflare.json`
      # with an `app` block), so this never fires in somebody's product.
      - name: A behaviour change carries its porting note
        if: ${{ !inputs.plugins && inputs.rename == '' }}
        env:
          # The comparison point differs per trigger: a PR diffs against the branch it targets (so a
          # branch of several commits may carry its note in any one of them), a push to main against
          # the commit before it. The script diffs `base...HEAD`, and skips rather than fails when a
          # range will not resolve — which is what keeps the tag path (`workflow_call`, where
          # `event.before` is all zeros) quiet.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: node scripts/release-check.mjs --unreleased --base "$BASE"

      # ------------------------------------------------------------------ a renamed copy
      #
      # Every app starts as a copy renamed by `scripts/rename.mjs`, and a hyphenated slug is where
      # the rename bites: the bare kit name becomes `my-app` while its snake form becomes `my_app`,
      # so a value built from the wrong one only fails in a copy (0.15.1's API-key prefix did).
      # This renames the checkout as an adopter does, then commits it — the kit's scanners read
      # `git ls-files`, and a copy's gate runs on a committed tree — and creates the renamed test
      # database (`<snake>_test`) in the Postgres service, which `.env.test` now points at.
      - name: Rename the checkout to ${{ inputs.rename }}
        if: ${{ inputs.rename != '' }}
        env:
          SLUG: ${{ inputs.rename }}
        run: |
          set -euo pipefail
          node scripts/rename.mjs "$SLUG" --domain example.com --force --skip-install
          # The rename's own install is frozen on a runner and the workspace names just changed.
          pnpm install --no-frozen-lockfile
          node scripts/plugin-api-doc.mjs
          pnpm lint:fix
          git add -A
          git -c user.name=ci -c user.email=ci@example.com -c commit.gpgsign=false \
            commit --quiet --no-verify -m "Rename to $SLUG"
          cid=$(docker ps --filter "ancestor=pgvector/pgvector:pg17" --format '{{.ID}}' | head -1)
          docker exec "$cid" createdb -U test "${SLUG//-/_}_test"

      # ------------------------------------------------------------------ default plugins (D31)
      #
      # `defaultPlugins` in .rocketflare.json is a list of OBJECTS — `{ id, repo, ref?, subdir? }`
      # (`scripts/lib/upgrade-lib.mjs` `defaultPluginEntries` is the one reader, and it accepts a
      # bare string as an id with no repo, which fails here with the reason). `ref` is the pinned
      # tag; without one the repository's default branch is installed, which is a moving target and
      # only sensible while a plugin is being written.
      #
      # `pnpm plugin add` never copies a migration — the HOST numbers the DDL in its own journal
      # (§16) — so `db:generate` after each install and one `db:migrate:ci` at the end is the whole
      # of it, and it is exactly what a person does locally.
      - name: Install the default plugins
        if: ${{ inputs.plugins }}
        run: |
          set -euo pipefail
          # db:generate runs `dotenv -e .dev.vars`, so the file has to exist here as it does on a
          # laptop. It is git-ignored and holds nothing secret: a throwaway local database URL.
          printf 'DATABASE_URL=postgresql://test:test@localhost:5433/rocketflare_test\n' > apps/web/.dev.vars
          # The same reader ci.yml uses — `scripts/default-plugins.mjs`, which validates the list
          # through `defaultPluginEntryProblems` and refuses a malformed entry with the reason.
          node scripts/default-plugins.mjs --tsv > "$RUNNER_TEMP/default-plugins.tsv"
          while IFS=$'\t' read -r id repo ref subdir; do
            [ -n "$id" ] || continue
            spec="$repo"
            if [ -n "$ref" ]; then spec="$repo@$ref"; fi
            echo "::group::plugin add $spec"
            # `--allow-dirty` because the PREVIOUS plugin's `db:generate` left migration files in
            # the tree; the checkout itself is pristine and nothing here is committed.
            if [ -n "$subdir" ]; then
              pnpm plugin add "$spec" --subdir "$subdir" --apply --allow-dirty
            else
              pnpm plugin add "$spec" --apply --allow-dirty
            fi
            version=$(node --input-type=module -e "
              import { readFileSync } from 'node:fs'
              import { readManifest } from './scripts/lib/manifest.mjs'
              const { manifest } = readManifest()
              const s = (manifest?.surfaces ?? []).find(s => s.id === '$id')
              process.stdout.write(s?.source?.version ?? 'unpinned')
            ")
            pnpm db:generate --name "plugin-$id-$version"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/default-plugins.tsv"

      - name: Apply the generated migrations
        if: ${{ inputs.plugins }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/rocketflare_test
        run: pnpm db:migrate:ci

      # ------------------------------------------------------------------ the gate
      # Biome runs once over the whole workspace from the root biome.json.
      - run: pnpm lint
      # `pnpm typecheck` = `pnpm -r typecheck`: web runs `wrangler types` + `tsc`, cli and shared run
      # `tsc`. The web typegen file is committed (D22) so a fresh clone typechecks without wrangler
      # auth; if regenerating it changes anything, a binding or var was edited without committing
      # the regenerated file.
      - run: pnpm typecheck
      # A plugin declares its bindings rather than editing a toml (§16, decision 12), so installing
      # one must not move this file either — `pnpm provision cloudflare <env>` is what writes them.
      - name: apps/web/worker-configuration.d.ts is up to date
        run: git diff --exit-code -- apps/web/worker-configuration.d.ts

      # `docs/plugin-api.md` is generated from the source of the declared entries (D31), and it is
      # what makes `PLUGIN_API` mean anything: the committed document is the previous snapshot of
      # the surface, so a member that has changed or gone with no bump to `current` fails HERE,
      # naming the member. Same contract as the typegen step above — a diff means the file is
      # stale, so run the script and commit what it writes.
      #
      # Skipped in the plugins pass: the `used-by:` annotations are derived from the plugins
      # installed in the checkout, so installing `defaultPlugins` legitimately changes the file.
      # That is a property of the checkout, like the secrets scan and the porting note above, and
      # the first pass has already run it.
      - name: docs/plugin-api.md is up to date
        if: ${{ !inputs.plugins }}
        run: |
          node scripts/plugin-api-doc.mjs
          git diff --exit-code -- docs/plugin-api.md

      # `pnpm -r test`. Web: apps/web/.env.test points at localhost:5433 with dummy secrets
      # (committed); apps/web/tests/setup.ts runs db-roles --phase=role → migrate → --phase=grants,
      # truncates, seeds. TENANT_SCOPE_MODE=off: predicates-only; policies exist and
      # rls-coverage.test.ts checks every tenant table has one. CLI: plain vitest, no database.
      # With plugins installed this also runs each plugin's own tests: vitest discovers
      # `src/plugins/*/tests/{api,ui,config}` (§16).
      - run: pnpm test

      # `pnpm -r build`: web = typecheck (repeated, cheap) + `vite build` + dry-run `wrangler deploy`
      # (needs dist/ui for `[assets]`; it is what catches a Node-only import that tsc cannot see);
      # cli = `tsc -p tsconfig.build.json` → apps/cli/dist/cli.js; shared has nothing to build.
      - run: pnpm build
