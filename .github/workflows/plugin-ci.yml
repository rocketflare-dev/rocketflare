name: Plugin CI

# **The other half of decision 5's compatibility proof** (D31, docs/CONCEPTS.md §16).
#
# The kit's own CI installs its `defaultPlugins` and runs the gate (ci.yml). This file is the
# mirror, and it lives HERE rather than in each plugin so that a change to how a plugin is proved
# compatible reaches every plugin through one file: a plugin repository calls it with
#
#   jobs:
#     ci:
#       uses: rocketflare-dev/rocketflare/.github/workflows/plugin-ci.yml@main
#
# and it: reads the plugin's declared `requires.kit` range, finds the OLDEST and the NEWEST kit
# release inside that range, and for each one clones that kit, installs the plugin into it from
# this checkout, generates and applies the migrations the host owns, and runs the full gate.
#
# Both ends, not a midpoint, because those are the two a range actually promises: the floor an
# adopter may still be on, and the ceiling the kit has just moved to. A plugin that passes at both
# and fails in between is a possibility nobody has ever reported and a matrix of every release is a
# cost paid on every push.
#
# It never publishes, never deploys and never pushes: it clones the kit into a scratch directory
# and throws it away.

on:
  workflow_call:
    inputs:
      kit_repo:
        description: The kit repository to clone (https URL).
        type: string
        default: https://github.com/rocketflare-dev/rocketflare.git
      kit_ref:
        description: >-
          A kit BRANCH or tag to prove against, instead of resolving releases from the plugin's
          `requires.kit`. This is what makes a coordinated change verifiable rather than hopeful: a
          plugin cannot declare `>=0.7.0` before 0.7.0 exists, so without this the two repos can
          only be cross-tested after one of them has already released. A ref given here is used
          verbatim and the range is NOT consulted — a branch has no version to match against one.
        type: string
        default: ""
      kit_range:
        description: >-
          Override the range taken from the plugin's own `rocketflare-plugin.json` `requires.kit`.
          Use it to prove one specific version (`=0.6.0`) or a wider net than the plugin declares.
        type: string
        default: ""
      plugin_subdir:
        description: The plugin's directory within its own repository, when it is not the root.
        type: string
        default: ""
      plugin_subdirs:
        description: >-
          A JSON array of plugin directories, for a repository holding several
          (`'["plugins/analytics","plugins/approvals"]'`). One CI run then proves every plugin
          against every kit version its OWN range admits, instead of N repositories each running
          their own. Overrides `plugin_subdir` when set.
        type: string
        default: ""
    secrets:
      kit_token:
        description: A token with read access to the kit, when the kit repository is private.
        required: false

jobs:
  # Which kit versions does this plugin claim to work with, and which of them exist?
  versions:
    name: Resolve kit versions
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.resolve.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Clone the kit (tip, for its tooling)
        env:
          KIT_TOKEN: ${{ secrets.kit_token }}
          KIT_REPO: ${{ inputs.kit_repo }}
        run: |
          set -euo pipefail
          url="$KIT_REPO"
          # A private kit needs a token in the URL; a public one needs nothing, which is the case
          # that must stay simple.
          if [ -n "${KIT_TOKEN:-}" ]; then
            url="https://x-access-token:${KIT_TOKEN}@${KIT_REPO#https://}"
          fi
          git clone --depth 1 --quiet "$url" kit
          git -C kit config remote.origin.url "$KIT_REPO"
      - uses: actions/setup-node@v4
        with:
          node-version-file: kit/.nvmrc
      # The kit owns the range matcher (`satisfies` in scripts/lib/upgrade-lib.mjs), so the answer
      # here is the same answer `pnpm plugin add` and `pnpm kit:upgrade` give — one implementation,
      # not a shell approximation of one. `ls-remote --tags --refs` is used rather than the shallow
      # clone's own tags, which a --depth 1 clone does not have.
      # The script goes to a FILE beside the checkout rather than `node -e "..."`. Two reasons,
      # and the second is a trap: inside a double-quoted shell string every backtick and `${` in
      # the JS needs escaping, and one wrong escape yields a workflow whose YAML parses perfectly
      # and whose node step is nonsense; and it is written to the WORKSPACE, not `$RUNNER_TEMP`,
      # because ESM resolves `./kit/...` against the module's own directory — `node -e` resolved it
      # against the cwd, so a file in RUNNER_TEMP would look identical and never find the kit.
      - id: resolve
        env:
          KIT_REPO: ${{ inputs.kit_repo }}
          KIT_REF: ${{ inputs.kit_ref }}
          RANGE_OVERRIDE: ${{ inputs.kit_range }}
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          PLUGIN_SUBDIRS: ${{ inputs.plugin_subdirs }}
        run: |
          set -euo pipefail
          git ls-remote --tags --refs "$KIT_REPO" > "$RUNNER_TEMP/kit-tags.txt"
          cat > resolve.mjs <<'RESOLVE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'
          import { compareVersions, satisfies, VERSION_RE } from './kit/scripts/lib/upgrade-lib.mjs'

          // One repository may hold several plugins (the lockstep monorepo). Each still answers the
          // compatibility question for ITSELF: which kit contract a plugin compiles against is a
          // different question from which release shipped it.
          const subdirs = process.env.PLUGIN_SUBDIRS
            ? JSON.parse(process.env.PLUGIN_SUBDIRS)
            : [process.env.PLUGIN_SUBDIR ?? '']

          const tags = readFileSync(`${process.env.RUNNER_TEMP}/kit-tags.txt`, 'utf8')
            .split('\n')
            .map(l => l.split('refs/tags/')[1])
            .filter(t => t && VERSION_RE.test(t))
            .sort(compareVersions)

          const ref = process.env.KIT_REF
          const pairs = []
          for (const subdir of subdirs) {
            const manifestPath = ['plugin', subdir, 'rocketflare-plugin.json'].filter(Boolean).join('/')
            if (!existsSync(manifestPath)) {
              process.stderr.write(`::error::no rocketflare-plugin.json at '${manifestPath}' — check plugin_subdir(s)\n`)
              process.exit(1)
            }
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'))
            const label = manifest.id ?? subdir ?? 'plugin'

            // An explicit ref wins and is used verbatim: it is usually a branch, which has no
            // version, so there is nothing for a range to match.
            if (ref) {
              console.log(`${label}: kit_ref '${ref}' (requires.kit not consulted)`)
              pairs.push({ kit: ref, plugin: subdir ?? '', label })
              continue
            }

            const range = process.env.RANGE_OVERRIDE || manifest.requires?.kit || '*'
            const inRange = tags.filter(t => satisfies(t, range))
            if (inRange.length === 0) {
              process.stderr.write(`::error::${label}: no released kit version satisfies requires.kit '${range}' — the range names versions that do not exist\n`)
              process.exit(1)
            }
            // The floor and the ceiling: the oldest release an adopter may still be on, and the
            // newest the kit has reached. One entry when they are the same version.
            const kits = [...new Set([inRange[0], inRange[inRange.length - 1]])]
            console.log(`${label}: requires.kit '${range}' -> ${kits.join(', ')} (of ${inRange.length} in range)`)
            for (const kit of kits) pairs.push({ kit, plugin: subdir ?? '', label })
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `pairs=${JSON.stringify(pairs)}\n`)
          RESOLVE
          node resolve.mjs

  gate:
    name: ${{ matrix.label }} on kit ${{ matrix.kit }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # which END of the range broke is the whole diagnosis
      matrix:
        # An `include`-only matrix, because the pairs are not a cross product: each plugin is
        # proved against the kit versions ITS OWN range admits, and a shared ceiling is normal
        # while a shared floor is not.
        include: ${{ fromJson(needs.versions.outputs.pairs) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17 # migration 0000 runs CREATE EXTENSION vector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rocketflare_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d rocketflare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Clone the kit at ${{ matrix.kit }}
        env:
          KIT_TOKEN: ${{ secrets.kit_token }}
          KIT_REPO: ${{ inputs.kit_repo }}
        run: |
          set -euo pipefail
          url="$KIT_REPO"
          # A private kit needs a token in the URL; a public one needs nothing, which is the case
          # that must stay simple.
          if [ -n "${KIT_TOKEN:-}" ]; then
            url="https://x-access-token:${KIT_TOKEN}@${KIT_REPO#https://}"
          fi
          # --depth 2, not 1: the kit's own suite asserts against its real history
          # (`mirror().isAncestor` in tests/config/upgrade-lib.test.ts resolves HEAD~1), and the
          # kit's gate.yml hands it `fetch-depth: 0`. A depth-1 clone leaves HEAD~1 unresolvable,
          # so `pnpm test` below failed for EVERY plugin, at every kit version, with an error that
          # names neither the clone nor the plugin. Two commits is all that assertion needs.
          git clone --depth 2 --branch "${{ matrix.kit }}" --quiet "$url" kit
          git -C kit config remote.origin.url "$KIT_REPO"
          if [ ! -f kit/scripts/plugin.mjs ]; then
            echo "::error::kit ${{ matrix.kit }} has no scripts/plugin.mjs — it predates plugins. Raise the floor of requires.kit."
            exit 1
          fi
      # The pnpm version comes from the KIT's `packageManager`, not from this repository — a plugin
      # repo may have no package.json at all.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kit/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: kit/.nvmrc
          cache: pnpm
          cache-dependency-path: kit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: kit

      - name: Raise the test database connection limit
        run: |
          cid=$(docker ps --filter "ancestor=pgvector/pgvector:pg17" --format '{{.ID}}' | head -1)
          docker exec "$cid" psql -U test -d rocketflare_test -c "ALTER SYSTEM SET max_connections = 300;"
          docker restart "$cid"
          for _ in $(seq 1 30); do
            docker exec "$cid" pg_isready -U test -d rocketflare_test >/dev/null 2>&1 && break
            sleep 2
          done

      # The host — never the plugin — numbers the DDL in its own journal (§16), which is why this is
      # `plugin add` then `db:generate` rather than anything the plugin ships. Installing from a
      # PATH is the authoring loop: the working copy is read directly, so the commit under test is
      # the one installed.
      # A FILE rather than `node -e`, for the reason the resolve step above documents: inside a
      # double-quoted shell string every backtick and `${` needs escaping, and one wrong escape
      # yields a workflow whose YAML parses perfectly and whose node step is nonsense.
      - name: Write the unpin helper
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/unpin.mjs" <<'UNPIN'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [file, id] = process.argv.slice(2)
          const manifest = JSON.parse(readFileSync(file, 'utf8'))
          const before = manifest.defaultPlugins?.length ?? 0
          manifest.defaultPlugins = (manifest.defaultPlugins ?? []).filter(
            entry => (entry && entry.id ? entry.id : entry) !== id
          )
          writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`)
          console.log(`defaultPlugins: ${before} -> ${manifest.defaultPlugins.length} (dropped ${id})`)
          UNPIN

      - name: Install this plugin into the kit
        working-directory: kit
        env:
          PLUGIN_SUBDIR: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          # db:generate runs `dotenv -e .dev.vars`, so the file has to exist here as it does on a
          # laptop. Git-ignored, and it holds nothing secret: a throwaway local database URL.
          printf 'DATABASE_URL=postgresql://test:test@localhost:5433/rocketflare_test\n' > apps/web/.dev.vars
          manifest="$GITHUB_WORKSPACE/plugin/$PLUGIN_SUBDIR"
          id=$(node -p "require('${manifest%/}/rocketflare-plugin.json').id")
          # The kit cloned above is a RELEASED tag, so its `defaultPlugins` pins whichever version of
          # this plugin was current when that kit shipped — never the commit under test. `pnpm plugin
          # check`, which the kit's own gate runs below, compares an installed plugin against that
          # pin, so leaving it in place fails EVERY plugin release that has moved past it, BY
          # CONSTRUCTION: analytics 2.0.1 against a kit pinning 1.0.2 turned this workflow red for a
          # release whose code was correct, and it would stay red until a kit shipped pinning the new
          # version — which cannot happen before the plugin is released.
          #
          # So the entry is dropped rather than repinned. The pin is a statement about what that kit
          # RELEASE ships; this run is proving the working copy, which is a different artefact and
          # deliberately a different version. Repinning would make the check pass by asserting
          # something untrue.
          node "$GITHUB_WORKSPACE/unpin.mjs" .rocketflare.json "$id"
          # Re-formatted because `pnpm lint` runs against this clone and Biome owns this file's shape.
          pnpm exec biome check --write .rocketflare.json >/dev/null 2>&1 || true
          # `pnpm plugin add` refuses a dirty tree, so that an install is ONE reviewable diff. The
          # unpin above is a deliberate edit to a throwaway clone, so it is COMMITTED rather than
          # waved through with `--allow-dirty`: the guard then still means what it says about the
          # install that follows, instead of being switched off for it.
          # Conditional because `git commit` EXITS 1 when there is nothing to commit, and under
          # `set -euo pipefail` that kills the step. The tree is only dirty when this kit actually
          # pinned this plugin — true for a default plugin, false for every third-party one, which
          # is the case this workflow mostly serves.
          git diff --quiet || git -c user.name=ci -c user.email=ci@local commit -qam 'ci: drop the pin for the plugin under test'
          args=(add "$GITHUB_WORKSPACE/plugin" --apply --local)
          if [ -n "$PLUGIN_SUBDIR" ]; then args+=(--subdir "$PLUGIN_SUBDIR"); fi
          pnpm plugin "${args[@]}"
          pnpm db:generate --name "plugin-$id-ci"

      - name: Apply the generated migrations
        working-directory: kit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/rocketflare_test
        run: pnpm db:migrate:ci

      # The kit's own gate, unchanged — including the plugin's tests, which vitest discovers under
      # `src/plugins/*/tests/{api,ui,config}` once the plugin is installed.
      - run: pnpm lint
        working-directory: kit
      - run: pnpm typecheck
        working-directory: kit
      - run: pnpm test
        working-directory: kit
      - run: pnpm build
        working-directory: kit
