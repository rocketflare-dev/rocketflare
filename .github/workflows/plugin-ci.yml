name: Plugin CI

# **The other half of decision 5's compatibility proof** (D31, docs/CONCEPTS.md §16).
#
# The kit's own CI installs its `defaultPlugins` and runs the gate (ci.yml). This file is the
# mirror, and it lives HERE rather than in each plugin so that a change to how a plugin is proved
# compatible reaches every plugin through one file: a plugin repository calls it with
#
#   jobs:
#     ci:
#       uses: rocketflare-dev/rocketflare/.github/workflows/plugin-ci.yml@main
#
# and it: reads the plugin's declared `minKit`, pairs it with the newest kit release, and for each
# of those two clones that kit, installs the plugin into it from this checkout — after the plugins
# its `requires.plugins` names, resolved by id from the same checkout — generates and applies the
# migrations the host owns, and runs the full gate. The floor is the HIGHEST `minKit` across the
# plugin and those requirements.
#
# **Two ends, not a midpoint, and they are no longer a range.** A plugin declares `minKit` — one
# bare `X.Y.Z`, a floor with no ceiling — so the floor is that version and the ceiling is whatever
# the kit has most recently released. Those are the two that matter: the oldest kit an adopter may
# still be on, and the newest the kit has moved to. A plugin that passes at both and fails in
# between is a possibility nobody has ever reported, and a matrix of every release is a cost paid
# on every push.
#
# It never publishes, never deploys and never pushes: it clones the kit into a scratch directory
# and throws it away.

on:
  workflow_call:
    inputs:
      kit_repo:
        description: The kit repository to clone (https URL).
        type: string
        default: https://github.com/rocketflare-dev/rocketflare.git
      kit_ref:
        description: >-
          A kit BRANCH or tag to prove against, instead of deriving the floor and the ceiling from
          the plugin's `minKit`. This is what makes a coordinated change verifiable rather than
          hopeful: a plugin cannot declare `minKit: 0.8.0` before 0.8.0 exists, so without this the
          two repos can only be cross-tested after one of them has already released. A ref given
          here is used verbatim and `minKit` is NOT consulted — a branch has no version to compare.
        type: string
        default: ""
      plugin_subdir:
        description: The plugin's directory within its own repository, when it is not the root.
        type: string
        default: ""
      plugin_subdirs:
        description: >-
          A JSON array of plugin directories, for a repository holding several
          (`'["plugins/analytics","plugins/approvals"]'`). One CI run then proves every plugin
          against the kit versions ITS OWN `minKit` names, instead of N repositories each running
          their own. Overrides `plugin_subdir` when set.
        type: string
        default: ""
    secrets:
      kit_token:
        description: A token with read access to the kit, when the kit repository is private.
        required: false

jobs:
  # Which kit versions is this plugin proved against — its floor, and the kit's own ceiling?
  versions:
    name: Resolve kit versions
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.resolve.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      # **This job no longer clones the kit at all**, and that is the point of the change. It used
      # to, solely to import `satisfies`/`compareVersions` from the cloned kit's
      # `scripts/lib/upgrade-lib.mjs` — which meant this file, called as `@main`, depended on the
      # shape of a RELEASED tag's tooling. That asymmetry is what forced every workaround below it.
      #
      # **And it compares no versions.** With ranges gone, the only ordering question left is
      # "which tag is newest", which `sort -V` answers in the shell below. This repository already
      # carries several private semver comparators, and a fifth one copied into a workflow is the
      # exact defect this change exists to remove. What is left in JS is exact string work.
      #
      # The script goes to a FILE beside the checkout rather than `node -e "..."`. Two reasons, and
      # the second is a trap: inside a double-quoted shell string every backtick and `${` in the JS
      # needs escaping, and one wrong escape yields a workflow whose YAML parses perfectly and
      # whose node step is nonsense; and it is written to the WORKSPACE, not `$RUNNER_TEMP`,
      # because ESM resolves relative paths against the module's own directory.
      - id: resolve
        env:
          KIT_REPO: ${{ inputs.kit_repo }}
          KIT_REF: ${{ inputs.kit_ref }}
          PLUGIN_SUBDIR: ${{ inputs.plugin_subdir }}
          PLUGIN_SUBDIRS: ${{ inputs.plugin_subdirs }}
        run: |
          set -euo pipefail
          # `ls-remote --tags --refs` rather than a clone's own tags: nothing is cloned in this job,
          # and a shallow clone would not carry them anyway.
          # `sort -V` is a VERSION sort — it puts 0.10.0 ABOVE 0.7.0, where the lexical default puts
          # it below. GNU coreutils, present on every GitHub Ubuntu runner.
          # The grep is wrapped in `|| true` because grep EXITS 1 when nothing matches, and under
          # `set -euo pipefail` that would kill the step for a kit with no releases at all — a case
          # the script below reports properly, against the plugin that asked, by name.
          git ls-remote --tags --refs "$KIT_REPO" \
            | sed 's#.*refs/tags/##' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V > "$RUNNER_TEMP/kit-tags.txt"
          KIT_CEILING="$(tail -n 1 "$RUNNER_TEMP/kit-tags.txt")"
          export KIT_CEILING
          echo "newest kit release: ${KIT_CEILING:-<none>}"
          cat > resolve.mjs <<'RESOLVE'
          import { appendFileSync, existsSync, readdirSync, readFileSync } from 'node:fs'

          // **No version comparison happens in this file.** The ORDER was decided by `sort -V` in
          // the step above, so the newest tag arrives ready-made as KIT_CEILING and everything here
          // is exact string work: `releasedTags.includes(...)` is the `grep -Fx` of the shell
          // version, the dedup is `===`, and the HIGHEST of several floors is the one latest in that
          // already-sorted list — an index, not a parse. Nothing here parses a version number.
          const fail = message => {
            process.stderr.write(`::error::${message}\n`)
            process.exit(1)
          }

          // One repository may hold several plugins (the lockstep monorepo). Each still answers the
          // compatibility question for ITSELF: which kit contract a plugin compiles against is a
          // different question from which release shipped it.
          const subdirs = process.env.PLUGIN_SUBDIRS
            ? JSON.parse(process.env.PLUGIN_SUBDIRS)
            : [process.env.PLUGIN_SUBDIR ?? '']

          const releasedTags = readFileSync(`${process.env.RUNNER_TEMP}/kit-tags.txt`, 'utf8')
            .split('\n')
            .map(line => line.trim())
            .filter(Boolean)
          const ceiling = process.env.KIT_CEILING ?? ''

          // Parsed inside a try: a manifest with a trailing comma used to throw a raw stack whose
          // top frame is this workflow, naming neither the file nor the plugin.
          const readManifest = manifestPath => {
            try {
              return JSON.parse(readFileSync(manifestPath, 'utf8'))
            } catch (err) {
              fail(`${manifestPath} is not valid JSON: ${err.message}`)
            }
          }

          // **Every plugin in this checkout, by id** — the pool a `requires.plugins` entry resolves
          // against. A required plugin is proved from the SAME commit as the plugin that needs it,
          // never fetched from elsewhere: a lockstep repository changes the two together, and CI
          // must install what the commit under test actually contains.
          const byId = new Map()
          const walk = dir => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory() || entry.name === 'node_modules' || entry.name.startsWith('.')) continue
              const sub = `${dir}/${entry.name}`
              if (existsSync(`${sub}/rocketflare-plugin.json`)) {
                const manifest = readManifest(`${sub}/rocketflare-plugin.json`)
                const subdir = sub.slice('plugin/'.length)
                if (manifest.id && byId.has(manifest.id)) {
                  fail(`plugin id '${manifest.id}' is declared twice, in '${byId.get(manifest.id).subdir}' and '${subdir}'`)
                }
                if (manifest.id) byId.set(manifest.id, { subdir, manifest })
              }
              walk(sub)
            }
          }
          walk('plugin')

          // A requirement is "<id>" or { id, minVersion } (`parsePluginRequirement` in the kit). The
          // minVersion is `pnpm plugin add`'s to enforce once both are installed; here only the id
          // matters, because the version installed is by definition the one in this commit.
          const requiredIds = manifest =>
            (manifest.requires?.plugins ?? []).map(req => (typeof req === 'object' && req ? req.id : String(req)))

          // The plugins to install BEFORE this one, dependencies first (a depth-first post-order), so
          // `pnpm plugin add` — which refuses a plugin whose requirement is missing — always finds
          // what it needs. A cycle is refused: no install order satisfies one.
          const installOrder = (label, manifest) => {
            const order = []
            const visit = (id, path) => {
              if (path.includes(id)) fail(`${label}: requires.plugins forms a cycle: ${[...path, id].join(' -> ')}`)
              if (order.some(dep => dep.id === id)) return
              const found = byId.get(id)
              if (!found) {
                fail(`${label}: requires plugin '${id}', and no rocketflare-plugin.json in this checkout declares that id`)
              }
              for (const next of requiredIds(found.manifest)) visit(next, [...path, id])
              order.push({ id, subdir: found.subdir, manifest: found.manifest })
            }
            for (const id of requiredIds(manifest)) visit(id, [label])
            return order
          }

          const ref = process.env.KIT_REF
          const pairs = []
          for (const subdir of subdirs) {
            const manifestPath = ['plugin', subdir, 'rocketflare-plugin.json'].filter(Boolean).join('/')
            if (!existsSync(manifestPath)) {
              fail(`no rocketflare-plugin.json at '${manifestPath}' — check plugin_subdir(s)`)
            }
            const manifest = readManifest(manifestPath)
            const label = manifest.id ?? subdir ?? 'plugin'
            const deps = installOrder(label, manifest)
            // Space-separated: a subdir is a path in a git repository and never needs quoting here,
            // which is asserted rather than assumed.
            for (const dep of deps) {
              if (/\s/.test(dep.subdir)) fail(`${label}: required plugin directory '${dep.subdir}' contains whitespace`)
            }
            const depSubdirs = deps.map(dep => dep.subdir).join(' ')
            if (deps.length > 0) console.log(`${label}: installs ${deps.map(dep => dep.id).join(', ')} first`)

            // An explicit ref wins and is used verbatim: it is usually a branch, which has no
            // version, so there is nothing to match a floor against.
            if (ref) {
              console.log(`${label}: kit_ref '${ref}' (minKit not consulted)`)
              pairs.push({ kit: ref, plugin: subdir ?? '', deps: depSubdirs, label })
              continue
            }

            // `minKit` is a TOP-LEVEL manifest key, sibling to id/version/repo, and it is read in
            // exactly ONE spelling: one written in the wrong place must fail loudly here rather
            // than be quietly accepted, which is what a fallback would do.
            if (!ceiling) {
              fail(`${label}: the kit repository has no X.Y.Z release tags, so there is no version to prove against`)
            }
            // The floor is the HIGHEST `minKit` across the plugin and everything it installs: a kit
            // too old for a dependency cannot host the plugin either, whatever the plugin says.
            let floor = null
            for (const { id, manifest: m } of [{ id: label, manifest }, ...deps]) {
              const own = m.minKit
              if (!own) {
                fail(`${id}: declares no minKit — add a top-level "minKit": "0.7.0" naming the oldest kit release this plugin supports`)
              }
              // Exact membership, never a comparison — which is why ONE message covers both ways of
              // arriving here: a floor naming a version that was never released, and a floor still
              // written as a range. Checked here rather than left to `git clone --branch`, which
              // fails naming neither the plugin nor the field that was wrong.
              if (!releasedTags.includes(own)) {
                fail(`${id}: minKit '${own}' is not a released kit version (newest is ${ceiling}) — minKit is ONE bare X.Y.Z floor, not a range`)
              }
              if (floor === null || releasedTags.indexOf(own) > releasedTags.indexOf(floor)) floor = own
            }
            // The floor and the ceiling: the oldest kit an adopter may still be on, and the newest
            // the kit has reached. ONE entry when a plugin's floor is already the newest kit.
            const kits = floor === ceiling ? [floor] : [floor, ceiling]
            console.log(`${label}: minKit ${floor}, newest kit ${ceiling} -> ${kits.join(', ')}`)
            for (const kit of kits) pairs.push({ kit, plugin: subdir ?? '', deps: depSubdirs, label })
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `pairs=${JSON.stringify(pairs)}\n`)
          RESOLVE
          node resolve.mjs

  gate:
    name: ${{ matrix.label }} on kit ${{ matrix.kit }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # which END broke — the floor or the ceiling — is the whole diagnosis
      matrix:
        # An `include`-only matrix, because the pairs are not a cross product: each plugin is
        # proved against its OWN floor, and a shared ceiling is normal while a shared floor is not.
        include: ${{ fromJson(needs.versions.outputs.pairs) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17 # migration 0000 runs CREATE EXTENSION vector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rocketflare_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d rocketflare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Clone the kit at ${{ matrix.kit }}
        env:
          KIT_TOKEN: ${{ secrets.kit_token }}
          KIT_REPO: ${{ inputs.kit_repo }}
        run: |
          set -euo pipefail
          url="$KIT_REPO"
          # A private kit needs a token in the URL; a public one needs nothing, which is the case
          # that must stay simple.
          if [ -n "${KIT_TOKEN:-}" ]; then
            url="https://x-access-token:${KIT_TOKEN}@${KIT_REPO#https://}"
          fi
          # --depth 2, not 1: the kit's own suite asserts against its real history
          # (`mirror().isAncestor` in tests/config/upgrade-lib.test.ts resolves HEAD~1), and the
          # kit's gate.yml hands it `fetch-depth: 0`. A depth-1 clone leaves HEAD~1 unresolvable,
          # so `pnpm test` below failed for EVERY plugin, at every kit version, with an error that
          # names neither the clone nor the plugin. Two commits is all that assertion needs.
          git clone --depth 2 --branch "${{ matrix.kit }}" --quiet "$url" kit
          git -C kit config remote.origin.url "$KIT_REPO"
          if [ ! -f kit/scripts/plugin.mjs ]; then
            echo "::error::kit ${{ matrix.kit }} has no scripts/plugin.mjs — it predates plugins. Raise minKit."
            exit 1
          fi
      # The pnpm version comes from the KIT's `packageManager`, not from this repository — a plugin
      # repo may have no package.json at all.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kit/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: kit/.nvmrc
          cache: pnpm
          cache-dependency-path: kit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: kit

      - name: Raise the test database connection limit
        run: |
          cid=$(docker ps --filter "ancestor=pgvector/pgvector:pg17" --format '{{.ID}}' | head -1)
          docker exec "$cid" psql -U test -d rocketflare_test -c "ALTER SYSTEM SET max_connections = 300;"
          docker restart "$cid"
          for _ in $(seq 1 30); do
            docker exec "$cid" pg_isready -U test -d rocketflare_test >/dev/null 2>&1 && break
            sleep 2
          done

      # The host — never the plugin — numbers the DDL in its own journal (§16), which is why this is
      # `plugin add` then `db:generate` rather than anything the plugin ships. Installing from a
      # PATH is the authoring loop: the working copy is read directly, so the commit under test is
      # the one installed.
      - name: Install this plugin (and the plugins it requires) into the kit
        working-directory: kit
        env:
          PLUGIN_SUBDIR: ${{ matrix.plugin }}
          PLUGIN_DEPS: ${{ matrix.deps }}
        run: |
          set -euo pipefail
          # db:generate runs `dotenv -e .dev.vars`, so the file has to exist here as it does on a
          # laptop. Git-ignored, and it holds nothing secret: a throwaway local database URL.
          printf 'DATABASE_URL=postgresql://test:test@localhost:5433/rocketflare_test\n' > apps/web/.dev.vars
          manifest="$GITHUB_WORKSPACE/plugin/$PLUGIN_SUBDIR"
          id=$(node -p "require('${manifest%/}/rocketflare-plugin.json').id")
          # Nothing edits the cloned kit before the FIRST install, so `pnpm plugin add`'s refusal of
          # a dirty tree — which keeps an install to ONE reviewable diff — is satisfied by doing
          # nothing rather than by a commit. It used to take an edit and a commit: the kit cloned
          # above is a RELEASED tag, so its `defaultPlugins` pinned whichever version of this plugin
          # was current when that kit shipped, and a check compared the installed plugin against
          # that pin — failing every plugin release that had moved past it, by construction, until a
          # kit shipped pinning the new version, which cannot happen before the plugin is released.
          # That check is gone, so the unpin edit, its Biome re-format and its commit are gone too.
          #
          # **A plugin that `requires.plugins` gets them installed first** (`deps`, resolved by id
          # from THIS checkout, dependencies before dependants). The tree is dirty after the first
          # install, so every later one passes `--allow-dirty` — the one reviewable diff is a laptop
          # rule, and this clone is thrown away. The migration is generated ONCE, after the last
          # install, exactly as an adopter installing the set and then running `db:generate` would.
          dirty=()
          for dep in $PLUGIN_DEPS; do
            echo "installing required plugin $dep"
            pnpm plugin add "$GITHUB_WORKSPACE/plugin" --apply --local --subdir "$dep" "${dirty[@]}"
            dirty=(--allow-dirty)
          done
          args=(add "$GITHUB_WORKSPACE/plugin" --apply --local)
          if [ -n "$PLUGIN_SUBDIR" ]; then args+=(--subdir "$PLUGIN_SUBDIR"); fi
          pnpm plugin "${args[@]}" "${dirty[@]}"
          pnpm db:generate --name "plugin-$id-ci"

      - name: Apply the generated migrations
        working-directory: kit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/rocketflare_test
        run: pnpm db:migrate:ci

      # The kit's own gate, unchanged — including the plugin's tests, which vitest discovers under
      # `src/plugins/*/tests/{api,ui,config}` once the plugin is installed.
      - run: pnpm lint
        working-directory: kit
      - run: pnpm typecheck
        working-directory: kit
      - run: pnpm test
        working-directory: kit
      - run: pnpm build
        working-directory: kit
