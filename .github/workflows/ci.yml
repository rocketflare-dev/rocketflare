name: CI

# The quality gate, in ONE job: the secrets scan, then `pnpm gate` — lint, typecheck, test, build,
# the same command a person runs before committing and Launch's ship gate runs in a sandbox
# (docs/CONCEPTS.md §4). The workflow adds no check of its own beyond gitleaks, so what passes
# here is exactly what passes on a laptop; `tests/config/ci-workflows.test.ts` holds it to that.
#
# `pnpm test` (the gate's `test` step) starts the test Postgres and the Neon proxy from
# `apps/web/docker-compose.test.yml` itself, runs the suite under `postgres`, then the `driver`
# project under `neon` — the conformance pass that proves the driver seam this app deploys on
# (apps/web/src/db/CLAUDE.md). No `services:` block, no restart hack: the compose file is the one
# definition of the test database.
#
# deploy.yml calls this same file (`workflow_call`) before deploying a tag whose commit has no
# green CI run yet, so a commit is gated once and the gate never drifts between main and deploy.
# The kit's OWN checks (a renamed copy, the default plugins, the porting note) are kit.yml, which a
# copy never carries.
#
# Verified once (opt-in, for an app shipped by Launch): with the repository variable
# LAUNCH_GATE_APP_ID set to Launch's GitHub App id, `Gate`'s FIRST step asks whether Launch already
# gated the exact tree under test — a `launch/gate` check run from THAT app, `success`, whose
# `external_id` is `tree:<tree sha>` (scripts/gate-verified.mjs, rules in
# scripts/lib/gate-verified-lib.mjs). If so `Gate` runs only what the sandbox does not: gitleaks and
# `pnpm gate build`. Variable unset: the step is skipped (no API call) and `Gate` runs the full
# `pnpm gate` exactly as before. One job, so one runner: the lookup used to be a job of its own,
# and every run queued for two runners in sequence. `Gate` stays the one required check either way.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  # Cancel superseded runs on a PR branch, never when called from the deploy path.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # The lookup reads check runs and a commit's pull requests; nothing in this job writes. deploy.yml's
    # `ci` job grants the same three: a called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks scan
      # Was this tree already gated by Launch? Skipped outright without LAUNCH_GATE_APP_ID. Which
      # tree is compared: the CHECKED-OUT commit's — on a pull request GitHub's merge commit, the
      # bytes this job tests. Launch attests the PR head, so the head's attestation counts only when
      # the merge tree equals it (the branch already contains main's tip); once main moves on, the
      # trees differ and the full gate runs. On a push to main: the pushed commit, then the heads of
      # its PRs (GET /commits/{sha}/pulls) — an up-to-date PR squashed or merged leaves the same
      # tree. Any other event (deploy.yml's workflow_call on a tag or dispatch) answers false. Any
      # doubt answers false, and the script always exits 0: an empty or `false` output is the full
      # gate. It reads the tree from this very checkout, so there is nothing to re-check.
      - name: Verified by Launch?
        id: verified
        if: vars.LAUNCH_GATE_APP_ID != ''
        run: node scripts/gate-verified.mjs
        env:
          LAUNCH_GATE_APP_ID: ${{ vars.LAUNCH_GATE_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The two test images, pulled in the background while pnpm installs (~15-20 s a run). Whatever
      # has not arrived by the time `pnpm test` runs `docker compose up`, that pulls itself.
      - name: Pre-pull the test database images
        if: steps.verified.outputs.verified != 'true'
        run: |
          nohup docker compose -f apps/web/docker-compose.test.yml --profile neon pull --quiet \
            > "$RUNNER_TEMP/pull.log" 2>&1 &
      # pnpm version comes from `packageManager` in the root package.json. Must precede setup-node
      # so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Repository hygiene, not an app check, so it is not a gate step: the full history, so a
      # secret committed and then removed is still caught. The binary directly (the marketplace
      # action needs a licence for org repos).
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --verbose .

      # Launch's sandbox already passed lint, typecheck and test on this tree; build is the step it
      # does not prove here (the dry-run `wrangler deploy` that catches a Node-only import).
      - name: pnpm gate build (the rest passed in Launch on this tree)
        if: steps.verified.outputs.verified == 'true'
        run: pnpm gate build

      - if: steps.verified.outputs.verified != 'true'
        run: pnpm gate
