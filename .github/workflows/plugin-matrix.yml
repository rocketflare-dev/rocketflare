name: Plugin matrix

# **Does every published plugin still work on this kit?** (#180, docs/CONCEPTS.md §16.) The LATEST
# release of each plugin in rocketflare-dev/rocketflare-plugins, against ONE kit ref: one job per
# plugin (its `requires.plugins` installed first) and one full-house job with every plugin
# installed together, because a collision between two plugins is a fault of neither alone. Never
# older plugin releases, never older kits, never an app.
#
# It runs on every kit tag (against that tag), on `workflow_dispatch` (scripts/release.mjs
# dispatches it against `main` before a release and prints the verdicts) and as a reusable workflow
# for a plugin repository's own release.
#
# **It reports through the run and nothing else**: a failing plugin fails its job and so the run,
# and the summary job writes one row per plugin — pass/fail, the failing step, the value-check
# warning count (`pnpm plugin check --json`, the readiness signal a contract such as #197's
# `egress` waits on) and the kit sha. It never creates, edits or closes an issue: that was decided
# against. It replaces notify-plugins.yml's repository dispatch, whose token was never set.
#
# The logic is scripts/plugin-matrix.mjs, run from a sparse checkout of the kit at the workflow's
# own commit (or `tools_ref` when another repository calls this), so proving an OLDER kit tag never
# depends on that tag carrying the script. It never publishes, deploys or pushes.

run-name: >-
  Plugin matrix ${{ inputs.kit_ref || github.ref_name }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      kit_ref:
        description: Kit branch, tag or sha to prove against. Empty = the newest kit release tag.
        type: string
        default: ''
      plugins:
        description: Comma-separated plugin ids. Empty = every published plugin.
        type: string
        default: ''
      full_house:
        description: Also run the job with every published plugin installed together.
        type: boolean
        default: true
      plugins_ref:
        description: A plugins-repository branch or tag instead of its newest release (a coordinated change).
        type: string
        default: ''
      force_fail:
        description: >-
          Rehearsal only — a matrix id (a plugin id or `full-house`) whose job fails on purpose
          after the install, to check that a failure reaches the summary and release.mjs.
        type: string
        default: ''
      request_id:
        description: Put in the run name, so a dispatcher (release.mjs) can find its own run.
        type: string
        default: ''
  workflow_call:
    inputs:
      kit_ref:
        type: string
        default: ''
      plugins:
        type: string
        default: ''
      full_house:
        type: boolean
        default: true
      plugins_repo:
        description: The plugins repository (https URL).
        type: string
        default: https://github.com/rocketflare-dev/rocketflare-plugins.git
      plugins_ref:
        type: string
        default: ''
      tools_ref:
        description: The kit ref scripts/plugin-matrix.mjs is read from, when another repository calls this.
        type: string
        default: main
      force_fail:
        type: string
        default: ''
      request_id:
        type: string
        default: ''
    outputs:
      results:
        description: JSON array, one entry per matrix job — { id, version, outcome, step, warnings, kitSha }.
        value: ${{ jobs.summary.outputs.results }}

permissions:
  contents: read

env:
  KIT_REPOSITORY: rocketflare-dev/rocketflare
  PLUGINS_REPO: ${{ inputs.plugins_repo || 'https://github.com/rocketflare-dev/rocketflare-plugins.git' }}
  # The workflow's own commit when the kit runs it; `tools_ref` (default main) when a plugin
  # repository calls it, where `github.sha` is the caller's commit.
  TOOLS_REF: ${{ github.repository == 'rocketflare-dev/rocketflare' && github.sha || inputs.tools_ref || 'main' }}

jobs:
  resolve:
    name: Resolve the kit ref and the plugins
    runs-on: ${{ vars.RF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      kit_ref: ${{ steps.kit.outputs.kit_ref }}
      plugins_ref: ${{ steps.plugins.outputs.plugins_ref }}
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ env.TOOLS_REF }}
          path: tools
          persist-credentials: false
          # Two FILES, so not cone mode (which takes directories).
          sparse-checkout: |
            /scripts/plugin-matrix.mjs
            /.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/.nvmrc
      # A kit tag proves that tag; otherwise the input, else the newest kit release. Only the KIT's
      # own tag push: a plugin repository's release calls this from ITS tag push, and its tag
      # (`3.15.0`) names no kit — or, worse, an unrelated one.
      - id: kit
        env:
          INPUT_REF: ${{ inputs.kit_ref }}
          TAG: ${{ github.repository == 'rocketflare-dev/rocketflare' && github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$TAG}"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote --tags --refs --sort=version:refname "https://github.com/$KIT_REPOSITORY.git" \
              | sed 's#.*refs/tags/##' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | tail -n 1)
          fi
          if [ -z "$ref" ]; then echo "::error::no kit ref to prove against"; exit 1; fi
          echo "kit ref: $ref"
          echo "kit_ref=$ref" >> "$GITHUB_OUTPUT"
      - id: plugins
        env:
          PLUGINS: ${{ inputs.plugins }}
          PLUGINS_REF: ${{ inputs.plugins_ref }}
          # The kit's tag push has no inputs: the full house runs. A caller passes its own.
          FULL_HOUSE: ${{ (github.repository == 'rocketflare-dev/rocketflare' && github.event_name == 'push') || inputs.full_house }}
        run: |
          set -euo pipefail
          args=(resolve --plugins-repo "$PLUGINS_REPO" --github-output)
          if [ -n "$PLUGINS" ]; then args+=(--only "$PLUGINS"); fi
          if [ -n "$PLUGINS_REF" ]; then args+=(--plugins-ref "$PLUGINS_REF"); fi
          if [ "$FULL_HOUSE" != "true" ]; then args+=(--no-full-house); fi
          node tools/scripts/plugin-matrix.mjs "${args[@]}"

  plugin:
    name: matrix ${{ matrix.id }}
    needs: resolve
    runs-on: ${{ vars.RF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false # which plugin broke is the whole diagnosis
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      KIT_REF: ${{ needs.resolve.outputs.kit_ref }}
      PLUGINS_REF: ${{ needs.resolve.outputs.plugins_ref }}
    steps:
      # The script first, so a kit ref that will not check out still records a result.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ env.TOOLS_REF }}
          path: tools
          persist-credentials: false
          # Two FILES, so not cone mode (which takes directories).
          sparse-checkout: |
            /scripts/plugin-matrix.mjs
            /.nvmrc
          sparse-checkout-cone-mode: false
      # --depth 2: the kit's suite resolves HEAD~1 in places (plugin-ci.yml says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ env.KIT_REF }}
          path: kit
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: kit/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kit/.nvmrc
          cache: pnpm
          cache-dependency-path: kit/pnpm-lock.yaml
      - id: deps
        name: Install the kit dependencies
        working-directory: kit
        run: pnpm install --frozen-lockfile
      - id: db
        name: Start the test database
        working-directory: kit
        run: docker compose -f apps/web/docker-compose.test.yml --profile neon up -d --wait
      # As an adopter does it: `plugin add` from the released tag, then the HOST generates the
      # migration (§16), one per plugin and named for it. Requirements come first (`installs` is
      # in install order); `--allow-dirty` after the first, because the previous install left files.
      - id: install
        name: Install the plugin(s) into the kit
        working-directory: kit
        env:
          INSTALLS: ${{ matrix.installs }}
        run: |
          set -euo pipefail
          # db:generate runs `dotenv -e .dev.vars`; a throwaway local database URL, nothing secret.
          printf 'DATABASE_URL=postgresql://test:test@localhost:5433/rocketflare_test\n' > apps/web/.dev.vars
          dirty=()
          for pair in $INSTALLS; do
            id="${pair%%=*}"
            subdir="${pair#*=}"
            echo "::group::plugin add $id ($PLUGINS_REPO@$PLUGINS_REF, $subdir)"
            pnpm plugin add "$PLUGINS_REPO@$PLUGINS_REF" --subdir "$subdir" --apply "${dirty[@]}"
            dirty=(--allow-dirty)
            pnpm db:generate --name "plugin-$id-matrix"
            echo "::endgroup::"
          done
          # Staged, as an adopter commits an install: the source scanners read `git ls-files`.
          git add -A
      - id: migrate
        name: Apply the generated migrations
        working-directory: kit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/rocketflare_test
        run: pnpm db:migrate:ci
      # The value checks: failures fail the job; warnings are counted into the summary. A kit older
      # than `check --json` leaves an unparseable file, which the summary shows as `n/a`.
      - id: check
        name: pnpm plugin check
        working-directory: kit
        run: |
          set -uo pipefail
          node scripts/plugin.mjs check --json > "$RUNNER_TEMP/check.json"
          status=$?
          cat "$RUNNER_TEMP/check.json"
          exit $status
      - id: rehearse
        name: 'Rehearsal: fail on purpose'
        if: inputs.force_fail != '' && inputs.force_fail == matrix.id
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          echo "::error::force_fail=$MATRIX_ID: this job fails on purpose (a rehearsal of the failure path)"
          exit 1
      - id: gate
        name: The kit gate
        working-directory: kit
        run: |
          set -euo pipefail
          # Prove the plugin in what an adopter runs: a copy has no tests/kit-only (plugin-ci.yml).
          git rm -r -q --ignore-unmatch apps/web/tests/kit-only
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm gate 2>&1 | tee "$RUNNER_TEMP/gate.log"
      - name: Record the result
        if: always()
        env:
          STEPS: ${{ toJson(steps) }}
          MATRIX_ID: ${{ matrix.id }}
          VERSION: ${{ matrix.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          node tools/scripts/plugin-matrix.mjs result --id "$MATRIX_ID" --version "$VERSION" \
            --kit-ref "$KIT_REF" --kit-sha "$(git -C kit rev-parse HEAD 2>/dev/null || echo unknown)" \
            --run-url "$RUN_URL" --log "$RUNNER_TEMP/gate.log" --check "$RUNNER_TEMP/check.json" \
            --out "$RUNNER_TEMP/result/$MATRIX_ID.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-matrix-${{ matrix.id }}
          path: ${{ runner.temp }}/result/${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: Summary
    needs: [resolve, plugin]
    if: always() && needs.resolve.result == 'success'
    runs-on: ${{ vars.RF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      results: ${{ steps.summary.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ env.TOOLS_REF }}
          path: tools
          persist-credentials: false
          # Two FILES, so not cone mode (which takes directories).
          sparse-checkout: |
            /scripts/plugin-matrix.mjs
            /.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-matrix-*
          path: results
          merge-multiple: true
      # A job that never recorded a result (cancelled, or the runner lost) is a row too: `--expect`.
      - id: summary
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          node tools/scripts/plugin-matrix.mjs summary --dir results --expect "$MATRIX" --github-output \
            | tee -a "$GITHUB_STEP_SUMMARY"
